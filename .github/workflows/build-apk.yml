name: Build Android APK V80

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK manager
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Using $SDKMANAGER"

      - name: Accept Android SDK licenses
        run: yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Install stable Android SDK 36
        run: |
          "$SDKMANAGER" --channel=0 \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Verify versions and project
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          grep -E 'compileSdk|targetSdk' app/build.gradle.kts
          test -f app/src/main/assets/index.html
          test -f app/src/main/res/layout/widget_quick_entry.xml

      - name: Validate V79 quick entry and source
        run: |
          node --check scripts/test_quick_entry.js
          node scripts/test_quick_entry.js
          grep -q 'when (result.trim' app/src/main/java/com/quan/thuchi/QuickEntryActivity.kt

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ThuChi-V80-DomTagFix-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThuChi-V80-DomTagFix-debug-apk
          path: ThuChi-V80-DomTagFix-debug.apk
          if-no-files-found: error
          retention-days: 30
